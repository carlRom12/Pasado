<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF7EF" />
    <script>
      let savedTheme
      try { savedTheme = localStorage.getItem('pasado-theme') } catch {}
      const dark = savedTheme === 'dark' || (savedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      if (dark) document.querySelector('meta[name="theme-color"]').content = '#191521'
    </script>
    <link rel="icon" href="./icons/pasado-192.png" />
    <link rel="apple-touch-icon" href="./icons/pasado-192.png" />
    <meta name="description" content="Plan your board exam study and track your mock exam scores." />
    <title>Pasado</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
